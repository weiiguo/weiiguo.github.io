<nav class="site-nav" aria-label="Main navigation">
  <div class="nav-container">
    <a class="nav-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — Home">
      <img src="{{ '/assets/img/UST.png' | relative_url }}?v=6d523a39" alt="HKUST" width="112" height="36">
      <span class="nav-brand-name"><span class="nav-welcome-prefix">Welcome to </span><strong>{{ site.title }}'s Homepage</strong></span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-controls="navLinks" aria-expanded="false" hidden>
      <span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      {% for item in site.data.navigation.main %}
      <li><a href="{{ item.url | relative_url }}" class="nav-link"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a></li>
      {% endfor %}
    </ul>
  </div>
</nav>
